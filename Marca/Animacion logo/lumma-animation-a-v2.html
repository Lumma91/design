<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lumma — Logo Animation v2</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #080808;
    --green: #CCFF00;
    --pink: #E6007E;
    --white: #FFFFFF;
    --gray: #777777;
  }

  body {
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
    font-family: 'Plus Jakarta Sans', sans-serif;
  }

  .scene {
    position: relative;
    width: 540px;
    height: 540px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ── AMBIENT GLOW — más grande, más intenso ── */
  .glow-green {
    position: absolute;
    width: 420px;
    height: 420px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(204,255,0,0.28) 0%, rgba(204,255,0,0.08) 40%, transparent 70%);
    left: 50%;
    top: 50%;
    transform: translate(-80%, -50%);
    opacity: 0;
    animation: glowFadeIn 1s ease-out 0.3s forwards;
    filter: blur(28px);
  }

  .glow-pink {
    position: absolute;
    width: 420px;
    height: 420px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(230,0,126,0.22) 0%, rgba(230,0,126,0.07) 40%, transparent 70%);
    left: 50%;
    top: 50%;
    transform: translate(-20%, -50%);
    opacity: 0;
    animation: glowFadeIn 1s ease-out 0.6s forwards;
    filter: blur(28px);
  }

  /* Secondary deeper glow layer */
  .glow-green-deep {
    position: absolute;
    width: 260px;
    height: 260px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(204,255,0,0.18) 0%, transparent 65%);
    left: 50%;
    top: 50%;
    transform: translate(-90%, -50%);
    opacity: 0;
    animation: glowFadeIn 0.7s ease-out 0.9s forwards;
    filter: blur(14px);
  }

  .glow-pink-deep {
    position: absolute;
    width: 260px;
    height: 260px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(230,0,126,0.16) 0%, transparent 65%);
    left: 50%;
    top: 50%;
    transform: translate(-10%, -50%);
    opacity: 0;
    animation: glowFadeIn 0.7s ease-out 1.0s forwards;
    filter: blur(14px);
  }

  /* ── ISOTIPO ── */
  .isotipo {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) translateY(-40px);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .circle-green {
    animation: circleGreenEnter 0.75s cubic-bezier(0.16, 1, 0.3, 1) 0.2s both;
  }

  .circle-pink {
    animation: circlePinkEnter 0.75s cubic-bezier(0.16, 1, 0.3, 1) 0.52s both;
  }

  .circle-center {
    animation: centerAppear 0.35s ease-out 0.95s both;
  }

  /* ── HALO around isotipo after it forms ── */
  .isotipo-halo {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) translateY(-40px);
    width: 140px;
    height: 80px;
    border-radius: 50%;
    background: radial-gradient(ellipse, rgba(204,255,0,0.0) 0%, transparent 70%);
    opacity: 0;
    animation: haloAppear 1.2s ease-out 1.0s forwards;
    filter: blur(16px);
    pointer-events: none;
  }

  /* ── SHINE — más amplio y brillante ── */
  .shine-mask {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) translateY(-40px);
    width: 110px;
    height: 68px;
    overflow: hidden;
    pointer-events: none;
  }

  .shine {
    position: absolute;
    top: -12px;
    left: -70px;
    width: 55px;
    height: 92px;
    background: linear-gradient(
      105deg,
      transparent 20%,
      rgba(255,255,255,0.15) 38%,
      rgba(255,255,255,0.65) 50%,
      rgba(255,255,255,0.15) 62%,
      transparent 80%
    );
    transform: skewX(-15deg);
    animation: shineSweep 0.55s ease-in-out 1.15s forwards;
    opacity: 0;
  }

  /* Green spark after shine */
  .spark {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) translateY(-40px);
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--green);
    opacity: 0;
    animation: sparkFlash 0.4s ease-out 1.68s forwards;
    box-shadow: 0 0 12px 6px rgba(204,255,0,0.6), 0 0 30px 12px rgba(204,255,0,0.2);
    pointer-events: none;
  }

  /* ── WORDMARK ── */
  .wordmark {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) translateY(28px);
    display: flex;
    gap: 0;
    overflow: hidden;
  }

  .wordmark span {
    display: inline-block;
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-weight: 800;
    font-size: 52px;
    letter-spacing: 10px;
    color: var(--white);
    opacity: 0;
    transform: translateY(20px);
    text-shadow: 0 0 40px rgba(255,255,255,0.0);
  }

  .wordmark span:nth-child(1) { animation: letterRise 0.5s cubic-bezier(0.16,1,0.3,1) 0.98s forwards; }
  .wordmark span:nth-child(2) { animation: letterRise 0.5s cubic-bezier(0.16,1,0.3,1) 1.07s forwards; }
  .wordmark span:nth-child(3) { animation: letterRise 0.5s cubic-bezier(0.16,1,0.3,1) 1.14s forwards; }
  .wordmark span:nth-child(4) { animation: letterRise 0.5s cubic-bezier(0.16,1,0.3,1) 1.21s forwards; }
  .wordmark span:nth-child(5) { animation: letterRise 0.5s cubic-bezier(0.16,1,0.3,1) 1.28s forwards; }

  /* Green glow pulse on wordmark after it appears */
  .wordmark-glow {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) translateY(28px);
    width: 300px;
    height: 70px;
    background: radial-gradient(ellipse, rgba(204,255,0,0.12) 0%, transparent 70%);
    opacity: 0;
    animation: wordGlowPulse 1.4s ease-out 1.5s forwards;
    filter: blur(10px);
    pointer-events: none;
  }

  /* ── TAGLINE ── */
  .tagline {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) translateY(80px);
    white-space: nowrap;
    font-family: 'Instrument Serif', serif;
    font-style: italic;
    font-size: 17px;
    color: var(--gray);
    letter-spacing: 2px;
    opacity: 0;
    animation: taglineFade 0.9s ease-out 1.75s forwards;
  }

  /* ── GREEN LINE ── */
  .underline-bar {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) translateY(108px);
    height: 1.5px;
    width: 0;
    background: linear-gradient(90deg, transparent, var(--green), transparent);
    animation: lineExpand 0.7s ease-out 1.95s forwards;
    box-shadow: 0 0 14px 2px rgba(204,255,0,0.7), 0 0 30px 6px rgba(204,255,0,0.25);
  }

  /* ── FADE OUT ── */
  .fadeout {
    position: absolute;
    inset: 0;
    background: var(--bg);
    opacity: 0;
    animation: sceneOut 0.65s ease-in 3.3s forwards;
    pointer-events: none;
  }

  /* ── CONTROLS ── */
  .replay-btn {
    position: fixed;
    bottom: 28px;
    right: 28px;
    background: #111;
    border: 1px solid #2a2a2a;
    color: var(--green);
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 2px;
    padding: 10px 18px;
    border-radius: 100px;
    cursor: pointer;
    opacity: 0;
    animation: replayAppear 0.4s ease 3.8s forwards;
    transition: background 0.2s, border-color 0.2s;
    z-index: 100;
  }
  .replay-btn:hover {
    background: #1a1a1a;
    border-color: rgba(204,255,0,0.35);
    box-shadow: 0 0 16px rgba(204,255,0,0.1);
  }

  .badge {
    position: fixed;
    bottom: 28px;
    left: 28px;
    background: #111;
    border: 1px solid #2a2a2a;
    color: #444;
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 10px;
    letter-spacing: 1px;
    padding: 8px 14px;
    border-radius: 100px;
    opacity: 0;
    animation: replayAppear 0.4s ease 3.8s forwards;
  }

  /* ════════════ KEYFRAMES ════════════ */

  @keyframes glowFadeIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }

  @keyframes circleGreenEnter {
    from { opacity: 0; transform: translateX(-22px) scale(0.82); filter: blur(6px); }
    to   { opacity: 1; transform: translateX(0) scale(1); filter: blur(0); }
  }

  @keyframes circlePinkEnter {
    from { opacity: 0; transform: translateX(22px) scale(0.82); filter: blur(6px); }
    to   { opacity: 1; transform: translateX(0) scale(1); filter: blur(0); }
  }

  @keyframes centerAppear {
    from { opacity: 0; transform: scale(0); }
    to   { opacity: 1; transform: scale(1); }
  }

  @keyframes haloAppear {
    0%   { opacity: 0; background: radial-gradient(ellipse, rgba(204,255,0,0.0) 0%, transparent 70%); }
    30%  { opacity: 1; background: radial-gradient(ellipse, rgba(204,255,0,0.22) 0%, rgba(230,0,126,0.10) 50%, transparent 70%); }
    100% { opacity: 0.6; background: radial-gradient(ellipse, rgba(204,255,0,0.10) 0%, rgba(230,0,126,0.05) 50%, transparent 70%); }
  }

  @keyframes shineSweep {
    0%   { opacity: 0; left: -70px; }
    8%   { opacity: 1; }
    92%  { opacity: 0.9; }
    100% { opacity: 0; left: 130px; }
  }

  @keyframes sparkFlash {
    0%   { opacity: 0; transform: translate(-50%, -50%) translateY(-40px) scale(0.5); }
    30%  { opacity: 1; transform: translate(-50%, -50%) translateY(-40px) scale(1.4); }
    100% { opacity: 0; transform: translate(-50%, -50%) translateY(-40px) scale(0.2); }
  }

  @keyframes letterRise {
    from { opacity: 0; transform: translateY(20px); filter: blur(4px); }
    to   { opacity: 1; transform: translateY(0); filter: blur(0); }
  }

  @keyframes wordGlowPulse {
    0%   { opacity: 0; }
    25%  { opacity: 1; }
    100% { opacity: 0; }
  }

  @keyframes taglineFade {
    from { opacity: 0; transform: translate(-50%, -50%) translateY(85px); }
    to   { opacity: 1; transform: translate(-50%, -50%) translateY(80px); }
  }

  @keyframes lineExpand {
    from { width: 0; opacity: 0; }
    to   { width: 180px; opacity: 1; }
  }

  @keyframes sceneOut {
    from { opacity: 0; }
    to   { opacity: 1; }
  }

  @keyframes replayAppear {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

</style>
</head>
<body>

<div class="scene" id="scene">

  <!-- Ambient glow — doble capa -->
  <div class="glow-green"></div>
  <div class="glow-pink"></div>
  <div class="glow-green-deep"></div>
  <div class="glow-pink-deep"></div>

  <!-- Isotipo -->
  <div class="isotipo">
    <svg width="100" height="58" viewBox="0 0 100 58" overflow="visible">
      <defs>
        <!-- Green circle glow filter — intenso -->
        <filter id="glow-g" x="-60%" y="-60%" width="220%" height="220%">
          <feGaussianBlur stdDeviation="4" result="blur1"/>
          <feGaussianBlur stdDeviation="8" result="blur2"/>
          <feMerge>
            <feMergeNode in="blur2"/>
            <feMergeNode in="blur1"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
        <!-- Pink circle glow filter — intenso -->
        <filter id="glow-p" x="-60%" y="-60%" width="220%" height="220%">
          <feGaussianBlur stdDeviation="3.5" result="blur1"/>
          <feGaussianBlur stdDeviation="7" result="blur2"/>
          <feMerge>
            <feMergeNode in="blur2"/>
            <feMergeNode in="blur1"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
      </defs>

      <circle class="circle-green" cx="31" cy="29" r="23"
        fill="#CCFF00"
        filter="url(#glow-g)" />

      <circle class="circle-pink" cx="69" cy="29" r="23"
        fill="#E6007E"
        filter="url(#glow-p)" />

      <circle class="circle-center" cx="50" cy="29" r="9.5"
        fill="#080808" />
    </svg>
  </div>

  <!-- Halo -->
  <div class="isotipo-halo"></div>

  <!-- Shine -->
  <div class="shine-mask"><div class="shine"></div></div>

  <!-- Spark -->
  <div class="spark"></div>

  <!-- Wordmark glow -->
  <div class="wordmark-glow"></div>

  <!-- Wordmark -->
  <div class="wordmark">
    <span>L</span><span>U</span><span>M</span><span>M</span><span>A</span>
  </div>

  <!-- Tagline -->
  <div class="tagline">Light your brand.</div>

  <!-- Green line -->
  <div class="underline-bar"></div>

  <!-- Fade out -->
  <div class="fadeout"></div>

</div>

<button class="replay-btn" onclick="replay()">↺ REPLAY</button>
<div class="badge">3.8s · Propuesta A v2</div>

<script>
  function replay() {
    const scene = document.getElementById('scene');
    const clone = scene.cloneNode(true);
    scene.parentNode.replaceChild(clone, scene);
  }
</script>

</body>
</html>
