<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lumma — Logo Animation</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #080808;
    --green: #CCFF00;
    --pink: #E6007E;
    --white: #FFFFFF;
    --gray: #777777;
  }

  body {
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
    font-family: 'Plus Jakarta Sans', sans-serif;
  }

  /* ── SCENE ── */
  .scene {
    position: relative;
    width: 540px;
    height: 540px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ── BACKGROUND GLOW ── */
  .glow-green {
    position: absolute;
    width: 320px;
    height: 320px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(204,255,0,0.12) 0%, transparent 70%);
    left: 50%;
    top: 50%;
    transform: translate(-80%, -50%);
    opacity: 0;
    animation: glowFadeIn 0.8s ease-out 0.4s forwards;
    filter: blur(20px);
  }

  .glow-pink {
    position: absolute;
    width: 320px;
    height: 320px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(230,0,126,0.1) 0%, transparent 70%);
    left: 50%;
    top: 50%;
    transform: translate(-20%, -50%);
    opacity: 0;
    animation: glowFadeIn 0.8s ease-out 0.7s forwards;
    filter: blur(20px);
  }

  /* ── ISOTIPO ── */
  .isotipo {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) translateY(-40px);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .isotipo svg {
    overflow: visible;
  }

  /* Circle green */
  .circle-green {
    animation: circleGreenEnter 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.2s both;
  }

  /* Circle pink */
  .circle-pink {
    animation: circlePinkEnter 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.5s both;
  }

  /* Center dot */
  .circle-center {
    animation: centerAppear 0.4s ease-out 0.9s both;
  }

  /* Shine sweep across isotipo */
  .shine-mask {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) translateY(-40px);
    width: 100px;
    height: 60px;
    overflow: hidden;
    pointer-events: none;
    animation: shineDelay 0s 1.1s both;
  }

  .shine {
    position: absolute;
    top: -10px;
    left: -60px;
    width: 40px;
    height: 80px;
    background: linear-gradient(105deg, transparent 30%, rgba(255,255,255,0.35) 50%, transparent 70%);
    transform: skewX(-15deg);
    animation: shineSweep 0.5s ease-in-out 1.1s forwards;
    opacity: 0;
  }

  /* ── WORDMARK ── */
  .wordmark {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) translateY(28px);
    display: flex;
    gap: 0;
    overflow: hidden;
  }

  .wordmark span {
    display: inline-block;
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-weight: 800;
    font-size: 52px;
    letter-spacing: 10px;
    color: var(--white);
    opacity: 0;
    transform: translateY(20px);
  }

  .wordmark span:nth-child(1) { animation: letterRise 0.5s cubic-bezier(0.16,1,0.3,1) 0.95s forwards; }
  .wordmark span:nth-child(2) { animation: letterRise 0.5s cubic-bezier(0.16,1,0.3,1) 1.05s forwards; }
  .wordmark span:nth-child(3) { animation: letterRise 0.5s cubic-bezier(0.16,1,0.3,1) 1.12s forwards; }
  .wordmark span:nth-child(4) { animation: letterRise 0.5s cubic-bezier(0.16,1,0.3,1) 1.19s forwards; }
  .wordmark span:nth-child(5) { animation: letterRise 0.5s cubic-bezier(0.16,1,0.3,1) 1.26s forwards; }

  /* ── TAGLINE ── */
  .tagline {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) translateY(80px);
    white-space: nowrap;
    font-family: 'Instrument Serif', serif;
    font-style: italic;
    font-size: 17px;
    color: var(--gray);
    letter-spacing: 2px;
    opacity: 0;
    animation: taglineFade 0.8s ease-out 1.7s forwards;
  }

  /* ── GREEN UNDERLINE ── */
  .underline-bar {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) translateY(108px);
    height: 1.5px;
    width: 0;
    background: var(--green);
    animation: lineExpand 0.6s ease-out 1.9s forwards;
    box-shadow: 0 0 8px var(--green);
  }

  /* ── FADE OUT OVERLAY ── */
  .fadeout {
    position: absolute;
    inset: 0;
    background: var(--bg);
    opacity: 0;
    animation: sceneOut 0.6s ease-in 3.2s forwards;
    pointer-events: none;
  }

  /* ── REPLAY BUTTON ── */
  .replay-btn {
    position: fixed;
    bottom: 28px;
    right: 28px;
    background: #111;
    border: 1px solid #2a2a2a;
    color: var(--green);
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 2px;
    padding: 10px 18px;
    border-radius: 100px;
    cursor: pointer;
    opacity: 0;
    animation: replayAppear 0.4s ease 3.6s forwards;
    transition: background 0.2s, border-color 0.2s;
    z-index: 100;
  }
  .replay-btn:hover {
    background: #1a1a1a;
    border-color: rgba(204,255,0,0.3);
  }

  /* ── DURATION BADGE ── */
  .badge {
    position: fixed;
    bottom: 28px;
    left: 28px;
    background: #111;
    border: 1px solid #2a2a2a;
    color: #444;
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 10px;
    letter-spacing: 1px;
    padding: 8px 14px;
    border-radius: 100px;
    opacity: 0;
    animation: replayAppear 0.4s ease 3.6s forwards;
  }

  /* ════════════ KEYFRAMES ════════════ */

  @keyframes glowFadeIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }

  @keyframes circleGreenEnter {
    from { opacity: 0; transform: translateX(-18px) scale(0.85); filter: blur(4px); }
    to   { opacity: 1; transform: translateX(0) scale(1); filter: blur(0); }
  }

  @keyframes circlePinkEnter {
    from { opacity: 0; transform: translateX(18px) scale(0.85); filter: blur(4px); }
    to   { opacity: 1; transform: translateX(0) scale(1); filter: blur(0); }
  }

  @keyframes centerAppear {
    from { opacity: 0; transform: scale(0); }
    to   { opacity: 1; transform: scale(1); }
  }

  @keyframes shineSweep {
    0%   { opacity: 0; left: -60px; }
    10%  { opacity: 1; }
    100% { opacity: 0; left: 120px; }
  }

  @keyframes letterRise {
    from { opacity: 0; transform: translateY(20px); filter: blur(3px); }
    to   { opacity: 1; transform: translateY(0); filter: blur(0); }
  }

  @keyframes taglineFade {
    from { opacity: 0; transform: translate(-50%, -50%) translateY(84px); }
    to   { opacity: 1; transform: translate(-50%, -50%) translateY(80px); }
  }

  @keyframes lineExpand {
    from { width: 0; opacity: 0; }
    to   { width: 160px; opacity: 0.6; }
  }

  @keyframes sceneOut {
    from { opacity: 0; }
    to   { opacity: 1; }
  }

  @keyframes replayAppear {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

</style>
</head>
<body>

<div class="scene" id="scene">

  <!-- Ambient glow -->
  <div class="glow-green"></div>
  <div class="glow-pink"></div>

  <!-- Isotipo SVG -->
  <div class="isotipo">
    <svg width="96" height="56" viewBox="0 0 96 56">
      <!-- Green circle -->
      <circle class="circle-green" cx="30" cy="28" r="22"
        fill="#CCFF00"
        filter="url(#glow-g)" />
      <!-- Pink circle -->
      <circle class="circle-pink" cx="66" cy="28" r="22"
        fill="#E6007E"
        filter="url(#glow-p)" />
      <!-- Dark center intersection -->
      <circle class="circle-center" cx="48" cy="28" r="9"
        fill="#080808" />

      <defs>
        <filter id="glow-g" x="-40%" y="-40%" width="180%" height="180%">
          <feGaussianBlur stdDeviation="2.5" result="blur"/>
          <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <filter id="glow-p" x="-40%" y="-40%" width="180%" height="180%">
          <feGaussianBlur stdDeviation="2.5" result="blur"/>
          <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>
    </svg>
  </div>

  <!-- Shine sweep -->
  <div class="shine-mask"><div class="shine"></div></div>

  <!-- Wordmark -->
  <div class="wordmark">
    <span>L</span><span>U</span><span>M</span><span>M</span><span>A</span>
  </div>

  <!-- Tagline -->
  <div class="tagline">Light your brand.</div>

  <!-- Green line -->
  <div class="underline-bar"></div>

  <!-- Fade to black -->
  <div class="fadeout"></div>

</div>

<!-- Controls -->
<button class="replay-btn" onclick="replay()">↺ REPLAY</button>
<div class="badge">3.8s · Intro Reel</div>

<script>
  function replay() {
    const scene = document.getElementById('scene');
    // Clone and replace to restart all animations
    const clone = scene.cloneNode(true);
    scene.parentNode.replaceChild(clone, scene);
  }
</script>

</body>
</html>
